name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    # A porta 22 do VPS ja ficou inacessivel a partir dos runners do GitHub
    # duas vezes em 02/09/2026 ("dial tcp ***:22: i/o timeout"), sempre de forma
    # intermitente: o site seguia no ar em 443 e a reexecucao manual do job
    # passava. Este passo espera a porta responder antes de tentar o deploy,
    # em vez de falhar na primeira negativa e exigir alguem reexecutando na mao.
    - name: Aguardar SSH do VPS responder
      run: |
        for tentativa in 1 2 3 4 5 6; do
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.VPS_HOST }}/22" 2>/dev/null; then
            echo "✅ Porta 22 respondeu na tentativa $tentativa."
            exit 0
          fi
          echo "⏳ Tentativa $tentativa de 6: porta 22 nao respondeu. Nova checagem em 30s..."
          sleep 30
        done
        echo "❌ A porta 22 do VPS nao respondeu em 6 tentativas (cerca de 3 minutos)."
        echo "   O site em producao NAO foi alterado: o deploy nem chegou a comecar."
        exit 1

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        command_timeout: 20m
        script: |
          set -e
          echo "🚀 INICIANDO DEPLOY COMPLETO"
          APP_PATH="/home/bhs-crm/htdocs/crm.bhseletrica.com.br"
          
          # 1. Atualizar código do repositório
          echo "📥 Atualizando código..."
          cd "$APP_PATH"
          git reset --hard
          git pull origin main
          
          # 2. Restaurar e configurar .env do backend
          echo "⚙️ Configurando backend..."
          cd "$APP_PATH/backend"
          if [ -f "/tmp/backend.env.backup" ]; then
            cp /tmp/backend.env.backup .env
            echo "✅ .env restaurado do backup."
          else
            echo "⚠️ Backup não encontrado. Usando .env atual."
          fi
          
          # 3. Enforçar PORT=3001
          sed -i 's/^PORT=.*/PORT=3001/' .env
          grep -q "^PORT=" .env || echo "PORT=3001" >> .env
          
          # 4. Instalar dependências do backend
          echo "📦 Instalando dependências do backend..."
          export NVM_DIR="/home/bhs-crm/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          npm install
          
          # 5. Reiniciar backend
          echo "🔄 Reiniciando backend..."
          
          # Limpeza agressiva: matar qualquer processo na porta 3001 (caso PM2 falhe)
          sudo fuser -k 3001/tcp || true
          
          # Verificar espaço em disco (evitar 502 por falta de logs/tmp)
          df -h | grep '^/'
          
          npx pm2 delete crm-backend || true
          npx pm2 start server.js --name crm-backend
          npx pm2 save
          
          # 6. Build do frontend
          echo "🎨 Buildando frontend..."
          cd "$APP_PATH/frontend"
          export NVM_DIR="/home/bhs-crm/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          npm install
          CI=false npm run build
          
          # 7. Copiar build para servir arquivos estáticos
          echo "📦 Preparando arquivos estáticos..."
          # Criar diretório público se não existir
          sudo mkdir -p "$APP_PATH/public"
          # Limpar conteúdo antigo
          sudo rm -rf "$APP_PATH/public"/*
          # Copiar arquivos do build
          sudo cp -r build/* "$APP_PATH/public/"
          
          # 8. Ajustar permissões
          echo "🔐 Ajustando permissões..."
          sudo chown -R bhs-crm:www-data "$APP_PATH/public"
          sudo chmod -R 755 "$APP_PATH/public"
          
          # 9. Validar backend
          echo "🔍 Validando backend..."
          sleep 5
          npx pm2 status crm-backend
          curl -I http://127.0.0.1:3001/api/ping || { 
            echo "❌ Backend não responde em 127.0.0.1:3001."
            echo "📋 LOGS PM2:"
            npx pm2 logs crm-backend --lines 50 --no-daemon & sleep 5 && kill $!
            exit 1
          }
          
          # 10. Debugar e Corrigir Nginx
          echo "📋 Verificando configuração do Nginx..."
          NGINX_CONF="/etc/nginx/sites-enabled/crm.bhseletrica.com.br.conf"
          
          if [ -f "$NGINX_CONF" ]; then
            echo "✅ Arquivo Nginx encontrado. Auditando proxy_pass..."
            cat "$NGINX_CONF" | grep "proxy_pass"
            
            # Corrigir automaticamente se estiver usando localhost ou porta 3000
            echo "🔧 Aplicando correções preventivas no Nginx (Porta 3001 + IPv4)..."
            sudo sed -i 's/proxy_pass http:\/\/localhost:3000/proxy_pass http:\/\/127.0.0.1:3001/g' "$NGINX_CONF"
            sudo sed -i 's/proxy_pass http:\/\/127.0.0.1:3000/proxy_pass http:\/\/127.0.0.1:3001/g' "$NGINX_CONF"
            sudo sed -i 's/proxy_pass http:\/\/localhost:3001/proxy_pass http:\/\/127.0.0.1:3001/g' "$NGINX_CONF"
            
            echo "✅ Nova configuração (proxy_pass):"
            cat "$NGINX_CONF" | grep "proxy_pass"
          else
            echo "⚠️  Arquivo $NGINX_CONF não encontrado. Pulando patch."
          fi
          
          echo "📋 Verificando quem está ouvindo nas portas..."
          sudo netstat -tulpn | grep LISTEN || true
          
          # 11. Reiniciar Nginx
          echo "🌐 Reiniciando Nginx..."
          sudo nginx -t && sudo systemctl restart nginx
          
          echo "✅ Deploy concluído!"
