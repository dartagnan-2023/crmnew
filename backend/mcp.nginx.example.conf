# Mascara o token quando ele vier no caminho da URL.
map $request_uri $mcp_safe_uri {
    default $request_uri;
    ~^(/api/mcp/k/)[^/?]+(.*)$ $1***$2;
}

log_format mcp_redacted '$remote_addr - $remote_user [$time_local] "$request_method $mcp_safe_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name mcp.seu-dominio.com.br;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.seu-dominio.com.br;

    ssl_certificate /etc/letsencrypt/live/mcp.seu-dominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.seu-dominio.com.br/privkey.pem;
    access_log /var/log/nginx/mcp.access.log mcp_redacted;

    location /api/mcp {
        proxy_pass http://127.0.0.1:8787/api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/mcp/k/ {
        proxy_pass http://127.0.0.1:8787/api/mcp/k/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
